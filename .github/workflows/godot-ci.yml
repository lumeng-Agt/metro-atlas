name: Godot story checks

on:
  push:
  pull_request:

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import project and parse scripts
        shell: pwsh
        run: |
          $output = godot --headless --path . --editor --quit 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0 -or ($output | Select-String -Pattern 'SCRIPT ERROR:|Failed to load script')) { throw "Project import or script parsing failed" }
      - name: Story, construction, saves and offline maps
        shell: pwsh
        run: |
          $tests = @('story_checks.gd', 'story_019_checks.gd', 'story_020_checks.gd', 'story_0201_checks.gd', 'story_0202_checks.gd', 'story_022_transfer_checks.gd', 'story_save_checks.gd', 'save_queue_checks.gd', 'official_target_checks.gd', 'engineering_construction_checks.gd', 'sibling_scope_reconfirmation_checks.gd', 'planned_station_name_checks.gd', 'chapter_lookup_checks.gd', 'beijing13_capacity_checks.gd', 'yizhuang_connector_checks.gd', 'shenzhen13_opening_checks.gd', 'beijing1_cutoff_checks.gd', 'guangzhou_xilang_body_checks.gd', 'chengdu_infill_extension_checks.gd', 'guangzhou22_opening_checks.gd', 'story_geometry_checks.gd', 'story_layout_checks.gd', 'map_hit_checks.gd', 'presentation_geometry_checks.gd', 'basemap_async_smoke.gd', 'tile_cache_smoke.gd')
          foreach ($test in $tests) {
            $data = Join-Path $env:RUNNER_TEMP ("metro-atlas-" + [guid]::NewGuid().ToString("N"))
            $output = godot --headless --path . --script "res://tests/$test" -- "--data-dir=$data" 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0 -or ($output | Select-String -Pattern 'SCRIPT ERROR:|Failed to load script')) { throw "Regression failed: $test" }
          }
          foreach ($test in @('guangzhou_passage_checks.gd', 'guangzhou6_opening_checks.gd', 'guangzhou12_chigang_checks.gd')) {
            $data = Join-Path $env:RUNNER_TEMP ("metro-atlas-opening-" + [guid]::NewGuid().ToString("N"))
            $output = godot --headless --path . --script "res://tests/$test" -- "--data-dir=$data" 2>&1
            $code = $LASTEXITCODE
            $output | Write-Output
            if ($code -ne 0 -or ($output | Select-String -Pattern 'SCRIPT ERROR:|Failed to load script')) { throw "Dated opening regression failed: $test" }
          }
      - name: Audit city route inventory against playable history
        shell: pwsh
        run: |
          # Generators are authoring-time scaffolding: they rebuild generated
          # chapters but deliberately do not preserve hand-authored ones. CI
          # therefore validates the committed data instead of re-running them.
          python tools/test_campaign_task_integrity.py
          if ($LASTEXITCODE -ne 0) { throw "Campaign task route integrity failed" }
          python tools/test_historical_station_references.py
          if ($LASTEXITCODE -ne 0) { throw "Historical station reference safeguards failed" }
          python tools/test_transfer_scope.py
          if ($LASTEXITCODE -ne 0) { throw "Pedestrian-only construction scope checks failed" }
          python tools/test_official_coverage_rules.py
          if ($LASTEXITCODE -ne 0) { throw "Independent coverage rule regressions failed" }
          python tools/test_project_plans.py
          if ($LASTEXITCODE -ne 0) { throw "Project plan coverage failed" }
          python tools/validate_project_spec.py --all
          if ($LASTEXITCODE -ne 0) { throw "Project spec validation failed" }
          python tools/test_project_spec_rules.py
          if ($LASTEXITCODE -ne 0) { throw "Project spec rule regressions failed" }
          python tools/test_operator_transfer_audit.py
          if ($LASTEXITCODE -ne 0) { throw "Operator transfer diagnostic regressions failed" }
          python tools/test_gzmtr_operator_orders.py
          if ($LASTEXITCODE -ne 0) { throw "Operator station-order extraction failed" }
          python tools/validate_engineering_specs.py
          if ($LASTEXITCODE -ne 0) { throw "Engineering scope validation failed" }
          python tools/test_network_baselines.py
          if ($LASTEXITCODE -ne 0) { throw "Network baseline checks failed" }
          python tools/test_network_coverage.py
          if ($LASTEXITCODE -ne 0) { throw "Network coverage checks failed" }
          python tools/test_historical_build_ranges.py
          if ($LASTEXITCODE -ne 0) { throw "Incremental historical build-range checks failed" }
          python tools/audit_network_coverage.py
          if ($LASTEXITCODE -ne 0) { throw "Network coverage audit failed" }
          git diff --exit-code -- docs/network-coverage-2026-10-01.json docs/network-coverage-2026-10-01.md
          if ($LASTEXITCODE -ne 0) { throw "Committed network coverage audit is stale" }
          python tools/report_project_chapters.py --check
          if ($LASTEXITCODE -ne 0) { throw "Committed project chapter report is stale" }
      - name: Five independent process restarts
        shell: pwsh
        run: ./tests/story_restart_five.ps1 -Godot godot
