name: Godot checks

on:
  push:
  pull_request:

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - name: Import project and parse scripts
        shell: pwsh
        run: godot --headless --path . --editor --quit
      - name: Run planning, simulation, migration, UI and offline-map checks
        shell: pwsh
        run: |
          $tests = @(
            'headless_checks.gd',
            'journey_simulation_checks.gd',
            'onboarding_checks.gd',
            'city_progression_checks.gd',
            'migration_smoke.gd',
            'save_smoke.gd',
            'ui_smoke.gd',
            'continue_save_regression.gd',
            'basemap_async_smoke.gd',
            'tile_cache_smoke.gd'
          )
          foreach ($test in $tests) {
            Write-Host "=== $test ==="
            godot --headless --path . --script "res://tests/$test"
            if ($LASTEXITCODE -ne 0) { throw "Godot regression failed: $test" }
          }
